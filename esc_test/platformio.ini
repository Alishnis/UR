; Standalone ESC test firmware, separate from the ROV firmware in ../src.
; Flash:  cd esc_test && pio run -t upload && pio device monitor
; Reflash the real firmware afterwards from the project root: pio run -t upload

[env:esp32-s3-devkitc1-n8r8]
platform = espressif32
board = esp32-s3-devkitc1-n8r8
framework = arduino
monitor_speed = 115200
upload_speed = 115200
