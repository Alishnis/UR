; ROV firmware (ESP32-S3-DevKitC-1 N8R8).
; The pioarduino platform is required: it ships Arduino core 3.x (needed for ledcAttach()) and the
; board id below, which the official `platformio/espressif32` platform does not have.
; PlatformIO downloads it by itself on the first build (about 1 GB, once).
; Do NOT add -DARDUINO_USB_CDC_ON_BOOT=1: it moves Serial to the other USB port.

[env:esp32-s3-devkitc1-n8r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
monitor_speed = 115200
upload_speed = 115200
