; ROV firmware (ESP32-S3-DevKitC-1 N8R8).
; `platform = espressif32` resolves to the pioarduino fork installed on this
; machine (Arduino core 3.x, needed for ledcAttach()). The board id below only
; exists in that fork.
; Do NOT add -DARDUINO_USB_CDC_ON_BOOT=1: it moves Serial to the other USB port.

[env:esp32-s3-devkitc1-n8r8]
platform = espressif32
board = esp32-s3-devkitc1-n8r8
framework = arduino
monitor_speed = 115200
upload_speed = 115200
