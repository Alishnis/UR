; ROV firmware (src/main.cpp), protocol: docs/PROTOCOL.md
; Upload: pio run -t upload   (stop the bridge / serial monitor first, they hold the port)
; Do NOT add -DARDUINO_USB_CDC_ON_BOOT=1: the board is on its UART USB-C port.
[env:esp32-s3-devkitc1-n8r8]
platform = espressif32
board = esp32-s3-devkitc1-n8r8
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps = madhephaestus/ESP32Servo
