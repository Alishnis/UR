; Standalone drive test: control the ROV from a serial monitor, no bridge, no GUI.
; Does not use ../src. Flash and open the monitor:
;   cd drive_test && pio run -t upload && pio device monitor
; Reflash the real firmware afterwards from the project root: pio run -t upload

[env:esp32-s3-devkitc1-n8r8]
platform = espressif32
board = esp32-s3-devkitc1-n8r8
framework = arduino
monitor_speed = 115200
upload_speed = 115200
